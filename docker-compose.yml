services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/render-cache:/config/data/render-cache
      - ./data/media:/media:ro
      - ./data/media:/media:ro
    ports:
      - "51000:8096"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      WEBUI_PORT: "51006"
      TORRENTING_PORT: "51415"
    volumes:
      - ./qbittorrent/config:/config
      - ./data:/data
    ports:
      - "51006:51006"
      - "51415:51415"
      - "51415:51415/udp"
    stop_grace_period: 10s
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      AUTO_UPDATE: "true"
    volumes:
      - ./jackett/config:/config
      - ./data:/data
    ports:
      - "51007:9117"
    restart: unless-stopped

  bootstrap:
    image: python:3.12-alpine
    profiles: [tools]
    network_mode: host
    user: "1000:1000"
    working_dir: /workspace
    environment:
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME:-admin}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD:-}"
    volumes:
      - ./:/workspace
    command: ["python3", "bootstrap.py"]
