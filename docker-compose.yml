services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./jellyfin/render-cache:/config/data/render-cache
      - ./media/movies:/media/movies:ro
      - ./media/tvshows:/media/tvshows:ro
      - ./media/music:/media/music:ro
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./transmission/config:/config
      - ./downloads:/downloads
    ports:
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped

  utorrent:
    image: ekho/utorrent:ubuntu-20.04
    container_name: utorrent
    environment:
      UID: "1000"
      GID: "1000"
      dir_root: /data
      dir_active: /data/incomplete
      dir_completed: /data/complete
      dir_download: /data/complete
      bind_port: "51414"
    volumes:
      - ./utorrent/settings:/utorrent/settings
      - ./downloads:/data
    ports:
      - "51414:51414"
      - "51414:51414/udp"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      WEBUI_PORT: "51006"
      TORRENTING_PORT: "51415"
    volumes:
      - ./qbittorrent/config:/config
      - ./downloads:/downloads
    ports:
      - "51006:51006"
      - "51415:51415"
      - "51415:51415/udp"
    stop_grace_period: 10s
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./radarr/config:/config
      - ./downloads:/downloads
      - ./media/movies:/media/movies
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./lidarr/config:/config
      - ./downloads:/downloads
      - ./media/music:/media/music
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: mmedia-nginx
    ports:
      - "51000:8080"
      - "51001:7878"
      - "51002:8686"
      - "51003:9696"
      - "51004:9091"
      - "51005:8081"
    depends_on:
      - jellyfin
      - transmission
      - utorrent
      - prowlarr
      - radarr
      - lidarr
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  bootstrap:
    image: python:3.12-alpine
    profiles: [tools]
    network_mode: host
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: ["python3", "bootstrap.py"]
